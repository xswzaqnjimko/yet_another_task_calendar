<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="60" fill="#007AFF"/>
  
  <!-- Grid representation -->
  <g fill="white" opacity="0.9">
    <!-- Horizontal lines -->
    <rect x="40" y="60" width="176" height="4" rx="2"/>
    <rect x="40" y="90" width="176" height="4" rx="2"/>
    <rect x="40" y="120" width="176" height="4" rx="2"/>
    <rect x="40" y="150" width="176" height="4" rx="2"/>
    <rect x="40" y="180" width="176" height="4" rx="2"/>
    
    <!-- Vertical lines -->
    <rect x="40" y="60" width="4" height="124" rx="2"/>
    <rect x="90" y="60" width="4" height="124" rx="2"/>
    <rect x="140" y="60" width="4" height="124" rx="2"/>
    <rect x="190" y="60" width="4" height="124" rx="2"/>
    
    <!-- Checkmark in one cell -->
    <path d="M 105 105 L 115 115 L 130 95" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Calendar icon at bottom -->
  <text x="128" y="225" font-size="40" text-anchor="middle" fill="white">📅</text>
</svg>
